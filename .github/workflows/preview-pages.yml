name: Preview Cloudflare Pages

# Branch preview for the book redesign. Production stays on the master
# workflow (.github/workflows/deploy-pages.yml), which deploys with
# --branch=master. This file lives on redesign-book only.
on:
  push:
    branches:
      - redesign-book

jobs:
  preview:
    runs-on: ubuntu-latest
    name: Preview
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=diogomonica-com --branch=redesign-book
