# Cloudflare Pages project for diogomonica.com
#
# Dashboard / Pages Git integration:
#   Framework preset: Astro
#   Build command:    npm run build
#   Output directory: dist
#   Node.js version:  22
#
# Local: npm run build && npx wrangler pages dev dist
#
# Agent Markdown: functions/_middleware.ts negotiates Accept on the
# static HTML. Keep output = "static" in astro.config.mjs.

name = "diogomonica-com"
compatibility_date = "2026-08-19"
pages_build_output_dir = "./dist"
